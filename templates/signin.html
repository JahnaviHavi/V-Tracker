<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
  <div class="signin-container">
    <h1>Sign In</h1>
    <form id="signinForm">
      <input type="email" id="email" placeholder="University Email" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Sign In</button>
      <p id="error-msg" class="error"></p>
    </form>
  </div>

  <script>
  document.getElementById("signinForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const errorMsg = document.getElementById("error-msg");

    if (!email.endsWith("@vitapstudent.ac.in")) {
      errorMsg.textContent = "Please use your university email (@vitapstudent.ac.in)";
      return;
    }

    try {
      // ✅ Use relative URL instead of localhost (works on Render too)
      const res = await fetch("/signin", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });

      const data = await res.json();

      if (data.message === "Login successful") {
        errorMsg.textContent = "";
        alert("Login successful! ✅");
        window.location.href = "/option";  // Go to your next page
      } else {
        errorMsg.textContent = data.error || "Invalid credentials";
      }
    } catch (err) {
      errorMsg.textContent = "⚠️ Error connecting to server!";
      console.error(err);
    }
  });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <!-- <link rel="stylesheet" href="styles.css"> -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
  <div class="signin-container">
    <h1>Sign In</h1>
    <form id="signinForm">
      <input type="email" id="email" placeholder="University Email" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Sign In</button>
      <p id="error-msg" class="error"></p>
    </form>
  </div>

  <script>
  document.getElementById("signinForm").addEventListener("submit", function(event) {
    event.preventDefault();
    
    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;
    let errorMsg = document.getElementById("error-msg");

    if (!email.endsWith("@vitapstudent.ac.in")) {
      errorMsg.textContent = "Please use your university email (@vitapstudent.ac.in)";
      return;
    }

    // Send signin data to Flask backend
    fetch("http://127.0.0.1:5000/signin", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        email: email,
        password: password
      })
    })
    .then(res => res.json())
    .then(data => {
      if (data.message === "Login successful") {
        errorMsg.textContent = "";
        alert("Login successful! ✅");
        window.location.href = "option.html";
      } else {
        errorMsg.textContent = data.error || "Invalid credentials";
      }
    })
    .catch(err => {
      errorMsg.textContent = "⚠️ Error connecting to server!";
      console.error(err);
    });
  });
  </script>

</body>
</html>

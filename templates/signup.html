<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
  <div class="signup-container">
    <h1>Create Your Account</h1>
    <form id="signupForm">
      <input type="text" name="name" placeholder="Full Name" required>
      <input type="tel" name="mobile" placeholder="Mobile Number" 
             pattern="[0-9]{10}" required 
             title="Enter a valid 10-digit mobile number">
      <input type="email" id="signupEmail" name="email" placeholder="University Email" required>
      <input type="text" name="verification" placeholder="Verification Code" required>
      <input type="password" name="password" placeholder="Password" required minlength="6">
      <button type="submit">Sign Up</button>
    </form>

    <p>Already have an account? 
      <a href="{{ url_for('signin') }}">Sign In</a>
    </p>
  </div>

  <script>
  document.getElementById("signupForm").addEventListener("submit", function(event) {
    event.preventDefault();
    
    let name = document.querySelector('input[name="name"]').value;
    let mobile = document.querySelector('input[name="mobile"]').value;
    let email = document.getElementById("signupEmail").value;
    let verification = document.querySelector('input[name="verification"]').value;
    let password = document.querySelector('input[name="password"]').value;

    if (!email.endsWith("@vitapstudent.ac.in")) {
      alert("Please use your university email (@vitapstudent.ac.in).");
      return;
    }

    // Send signup data to Flask backend
    fetch("{{ url_for('signup') }}", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        name: name,
        mobile: mobile,
        email: email,
        verification_code: verification,
        password: password
      })
    })
    .then(res => res.json())
    .then(data => {
      if (data.message) {
        alert("Signup successful ✅");
        window.location.href = "{{ url_for('option') }}";  // Redirect to options page
      } else {
        alert("Error: " + (data.error || "Signup failed"));
      }
    })
    .catch(err => {
      alert("⚠️ Error connecting to server!");
      console.error(err);
    });
  });
  </script>
</body>
</html>

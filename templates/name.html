<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faculty Status</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
  <div class="faculty-container">
    <h1>Check Faculty Status</h1>
    <form id="facultyForm">
      <input type="text" id="facultyName" placeholder="Enter Faculty Name" required>
      <button type="submit">Check</button>
    </form>

    <div id="status" class="status"></div>
  </div>

  <script>
  document.getElementById("facultyForm").addEventListener("submit", function(event) {
    event.preventDefault();

    let faculty = document.getElementById("facultyName").value;
    let statusDiv = document.getElementById("status");

    statusDiv.textContent = "Checking...";
    statusDiv.className = "status loading";

    // Fetch ThingSpeak value first
    fetch("https://api.thingspeak.com/channels/463304/fields/1/last")
      .then(res => res.text())
      .then(value => {
        value = value.trim();
        if (value === "1") {
          // ThingSpeak value is 1, Faculty Present; no Flask check
          statusDiv.textContent = `✅ ${faculty} is Present in Block, Room`;
          statusDiv.className = "status present";
        } else if (value === "0") {
          // ThingSpeak value is 0, Faculty Absent
          statusDiv.textContent = `❌ ${faculty} is Absent`;
          statusDiv.className = "status absent";
        } else {
          statusDiv.textContent = "⚠️ Error fetching ThingSpeak value!";
          statusDiv.className = "status";
        }
      })
      .catch(err => {
        statusDiv.textContent = "⚠️ Error connecting to ThingSpeak!";
        statusDiv.className = "status";
        console.error(err);
      });
  });
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Block</title>
  <!-- <link rel="stylesheet" href="styles.css"> -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
  <div class="option-container">
    <h1>Choose Block</h1>
    <div class="options">
      
      <div class="option-card" onclick="goToPage('ab1.html')">
        <p>AB1<br><br>Sarvepalli Radhakrishnan Block</p>
      </div>

      <div class="option-card" onclick="goToPage('cb.html')">
        <p>CB<br><br>Mahatma Gandhi Block</p>
      </div>

      <div class="option-card" onclick="goToPage('ab2.html')">
        <p>AB2<br><br>APJ Abdul Kalam Block</p>
      </div>

    </div>
  </div>

  <script>
    function goToPage(page) {
      // Add visual feedback before navigation
      document.querySelectorAll('.option-card').forEach(card => card.classList.remove('selected'));
      event.currentTarget.classList.add('selected');
      
      // Redirect after short delay
      setTimeout(() => {
        window.location.href = page;
      }, 300);
    }
  </script>
</body>
</html>
